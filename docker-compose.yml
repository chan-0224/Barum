# 로컬 리허설용 (맥미니). HTTP만 — 인증서는 도메인이 필요해서 서버에서만 붙는다.
# 운영은 docker-compose.prod.yml 을 겹쳐 올린다:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 메모리 배분 (서버 4GB 기준)
#   traefik 128m + spring 1280m + fastapi 640m = 2048m
#   나머지 ~2GB는 Ubuntu와 도커 데몬 몫. 넉넉하게 남긴다

services:
  # 도커 소켓을 Traefik에 직접 물리지 않는다.
  #   1) 소켓은 사실상 루트 권한이다. 컨테이너 목록만 읽으면 되는 Traefik에 전부 줄 이유가 없다
  #   2) Docker Desktop 29에서는 소켓 직접 마운트 시 API가 400을 돌려준다
  # 읽기 계열만 열고 나머지는 기본값(0)으로 막는다
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VERSION=1
      - EVENTS=1
      - PING=1
      - POST=0        # 컨테이너 생성·삭제 차단
      - ALLOW_START=0
      - ALLOW_STOP=0
      - ALLOW_RESTARTS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    networks: [barum]

  traefik:
    # v3.7 미만을 쓰지 말 것. 구버전은 도커 API를 /v1.24/ 로 부르는데 Docker 29는
    # 1.40 미만을 400으로 거부한다. 그러면 라우터가 하나도 안 붙고 모든 요청이 404가 되는데,
    # 에러는 Traefik 로그에만 남고 응답은 평범한 404라 원인을 찾기 어렵다.
    # DOCKER_API_VERSION 환경변수로는 안 고쳐진다(초기 version 호출에 반영되지 않음).
    image: traefik:v3.7
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      # 라벨을 붙인 컨테이너만 노출한다. 실수로 다른 컨테이너가 열리지 않게
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=INFO
    ports:
      # 서버에서는 80 그대로. 로컬에 이미 80을 쓰는 스택이 있으면 HTTP_PORT로 비켜간다
      - "${HTTP_PORT:-80}:80"
    mem_limit: 128m
    networks: [barum]

  spring:
    build:
      context: ./spring
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      - PORT=8080
    expose:
      - "8080"
    mem_limit: 1280m
    healthcheck:
      # alpine 이미지에 curl이 없다. busybox wget을 쓴다
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.spring.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.spring.entrypoints=web
      - traefik.http.services.spring.loadbalancer.server.port=8080
    networks: [barum]

  fastapi:
    build:
      context: ./barum-be
    restart: unless-stopped
    # .env.ai에는 SUPABASE_SERVICE_KEY만 있다. RLS를 우회하는 키라
    # 필요 없는 Spring 컨테이너의 환경에는 두지 않는다(원칙 4)
    env_file: [.env.production, .env.ai]
    expose:
      - "8000"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      # 루틴 SSE는 프론트가 직접 호출한다(docs/API.md 8). 그래서 외부로 열려 있어야 한다.
      # 나머지 /internal/v1 경로는 FastAPI가 X-Internal-Key로 막는다
      - traefik.http.routers.fastapi.rule=PathPrefix(`/internal/v1`)
      - traefik.http.routers.fastapi.entrypoints=web
      - traefik.http.services.fastapi.loadbalancer.server.port=8000
      # SSE가 끊기지 않게 압축 미들웨어를 붙이지 않는다. Traefik은 기본적으로 버퍼링하지 않는다
    networks: [barum]

networks:
  barum:
